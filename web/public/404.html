<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pushpak Vijay Katkhede</title>
    <!--
      Single-page-app routing fix for GitHub Pages, which has no server-side
      rewrites: https://github.com/rafgraph/spa-github-pages (MIT License)
      Encodes the requested path into a query string and redirects to the
      real index.html, where the inline script there decodes it and restores
      the original URL via history.replaceState before React mounts.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
