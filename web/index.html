    <!-- Decodes the redirect from 404.html (see public/404.html) back into a real
         path before React mounts, so BrowserRouter can pick up routes like /blog/foo.
         https://github.com/rafgraph/spa-github-pages (MIT License) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
